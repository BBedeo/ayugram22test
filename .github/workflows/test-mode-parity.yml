name: Test Mode parity guard

on:
  push:
    branches: [main, dev]
    paths:
      - 'TMessagesProj/src/main/java/**'
      - 'TMessagesProj/src/main/kotlin/**'
      - 'TMessagesProj/src/main/res/values*/strings_oe*.xml'
      - 'scripts/check_liquid_glass.py'
      - 'scripts/check_elastic_pills.py'
      - 'scripts/check_voip_glass.py'
      - 'scripts/check_test_mode_parity.py'
      - 'scripts/check_account_profiles.py'
      - 'AGENTS.md'
      - '.github/workflows/test-mode-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check native Telegram animation and Test transport wiring
        run: python3 scripts/check_test_mode_parity.py
      - name: Check account profile isolation and global settings search
        run: python3 scripts/check_account_profiles.py
      - name: Check optional universal Liquid Glass, native refraction and theme fallbacks
        run: python3 scripts/check_liquid_glass.py
      - name: Check elastic navigation, call actions and slider gestures
        run: python3 scripts/check_elastic_pills.py
      - name: Check private call glass and optional compact captions
        run: python3 scripts/check_voip_glass.py
